<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Crash Game</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<style>
  html,body{margin:0;padding:0;background:#05060c;height:100%;overflow:hidden;font-family:'Segoe UI',Tahoma,sans-serif;}
  #stage{position:relative;width:100%;height:100vh;}
  #scene3d{position:absolute;top:0;left:0;width:100%;height:100%;}
  #hud{position:absolute;top:0;left:0;right:0;padding:16px;text-align:center;pointer-events:none;}
  #multiplier{font-size:56px;font-weight:800;color:#fff;text-shadow:0 0 20px #7c5cff,0 0 45px #7c5cff,0 0 70px #4d8dff;
              transition:color .15s;}
  #multiplier.busted{color:#ff5c5c;text-shadow:0 0 20px #ff5c5c,0 0 45px #ff2020;}
  #multiplier.cashed{color:#2fbf71;text-shadow:0 0 20px #2fbf71,0 0 45px #1f9e5e;}
  #status{font-size:14px;color:#9d8cff;margin-top:4px;}
  #controls{position:absolute;bottom:0;left:0;right:0;padding:20px;display:flex;gap:10px;z-index:5;
             background:linear-gradient(to top, rgba(5,6,12,0.95), transparent);}
  input{flex:1;padding:14px;border-radius:12px;border:none;background:#181b2b;color:#fff;font-size:16px;box-sizing:border-box;}
  button{padding:14px 20px;border:none;border-radius:12px;font-size:16px;font-weight:bold;color:#fff;}
  #betBtn{background:linear-gradient(135deg,#7c5cff,#4d8dff);flex:1;box-shadow:0 4px 20px rgba(124,92,255,.5);}
  #cashBtn{background:linear-gradient(135deg,#2fbf71,#1f9e5e);flex:1;display:none;box-shadow:0 4px 20px rgba(47,191,113,.5);}
  #balance{position:absolute;top:16px;left:16px;color:#8dffb0;font-size:14px;pointer-events:none;z-index:5;
            background:rgba(20,22,35,.6);padding:6px 12px;border-radius:20px;backdrop-filter:blur(4px);}
  #profile{position:absolute;top:16px;right:16px;display:flex;align-items:center;gap:8px;z-index:5;
           background:rgba(20,22,35,.6);padding:6px 12px 6px 6px;border-radius:20px;backdrop-filter:blur(4px);}
  #profile img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid #7c5cff;}
  #profile .avatar-fallback{width:28px;height:28px;border-radius:50%;background:#7c5cff;color:#fff;
           display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;}
  #profile span{color:#eee;font-size:13px;font-weight:600;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene3d"></canvas>
  <div id="balance">رصيد: -- Coin</div>
  <div id="profile"></div>
  <div id="hud">
    <div id="multiplier">1.00x</div>
    <div id="status">اضغط ابدأ للدخول بجولة</div>
  </div>
  <div id="controls">
    <input id="betInput" type="number" placeholder="المبلغ" value="100">
    <button id="betBtn">🚀 ابدأ</button>
    <button id="cashBtn">💸 اسحب</button>
  </div>
</div>

<script>
/*
  Front-end only: pure presentation layer for a Telegram Mini App.
  All money/points logic lives server-side in bot.py / webapp_api.py — this
  file NEVER decides who wins. It only renders a real-time 3D scene (Three.js)
  driven by state polled from the server, and forwards bet/cashout intent.
  Any multiplier shown here before server confirmation is provisional UI only.
*/

const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

// Telegram gives us the opener's name/photo natively via initDataUnsafe - no
// extra request needed. This is DISPLAY ONLY; every game action still goes
// through the server, which re-validates the signed initData string itself.
(function renderProfile(){
  const u = tg?.initDataUnsafe?.user;
  const el = document.getElementById('profile');
  if(!u){ el.style.display = 'none'; return; }
  const name = [u.first_name, u.last_name].filter(Boolean).join(' ') || u.username || 'لاعب';
  const initial = name.trim().charAt(0).toUpperCase() || '?';
  el.innerHTML = u.photo_url
    ? `<img src="${u.photo_url}" alt=""><span>${name}</span>`
    : `<div class="avatar-fallback">${initial}</div><span>${name}</span>`;
})();

// ---------------------------------------------------------------- 3D SCENE

const canvas = document.getElementById('scene3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05060c, 0.012);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.5, 9);
camera.lookAt(0, 2, 0);

// Starfield
const starGeo = new THREE.BufferGeometry();
const STAR_COUNT = 800;
const starPositions = new Float32Array(STAR_COUNT * 3);
for (let i = 0; i < STAR_COUNT; i++) {
  starPositions[i*3]   = (Math.random()-0.5) * 120;
  starPositions[i*3+1] = (Math.random()-0.2) * 80;
  starPositions[i*3+2] = (Math.random()-0.5) * 120 - 20;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.18, transparent: true, opacity: 0.85 });
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// Lighting
scene.add(new THREE.AmbientLight(0x404060, 1.2));
const purpleLight = new THREE.PointLight(0x7c5cff, 6, 30);
purpleLight.position.set(0, 3, 3);
scene.add(purpleLight);
const rimLight = new THREE.DirectionalLight(0x4d8dff, 1.5);
rimLight.position.set(-5, 5, 5);
scene.add(rimLight);

// Rocket - built from primitives, no external model/textures needed
const rocket = new THREE.Group();

const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe8e8f5, metalness: 0.7, roughness: 0.25, emissive: 0x1a1a2e, emissiveIntensity: 0.3 });
const accentMat = new THREE.MeshStandardMaterial({ color: 0x7c5cff, metalness: 0.5, roughness: 0.3, emissive: 0x7c5cff, emissiveIntensity: 0.8 });
const finMat = new THREE.MeshStandardMaterial({ color: 0x4d8dff, metalness: 0.6, roughness: 0.3, emissive: 0x2255ff, emissiveIntensity: 0.5 });

const nose = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1.1, 24), bodyMat);
nose.position.y = 1.35;
rocket.add(nose);

const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.8, 24), bodyMat);
body.position.y = 0.0;
rocket.add(body);

const stripe = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.25, 24), accentMat);
stripe.position.y = 0.3;
rocket.add(stripe);

const finGeo = new THREE.ConeGeometry(0.28, 0.6, 4);
[[-0.42,-0.85,0],[0.42,-0.85,0],[0,-0.85,0.42],[0,-0.85,-0.42]].forEach(([x,y,z], i) => {
  const fin = new THREE.Mesh(finGeo, finMat);
  fin.position.set(x, y, z);
  fin.rotation.x = Math.PI;
  fin.rotation.y = i * Math.PI/2;
  rocket.add(fin);
});

const flame = new THREE.Mesh(
  new THREE.ConeGeometry(0.22, 0.7, 16),
  new THREE.MeshBasicMaterial({ color: 0xff7a3c, transparent: true, opacity: 0.85 })
);
flame.position.y = -1.4;
flame.rotation.x = Math.PI;
rocket.add(flame);

rocket.rotation.z = -0.15;
scene.add(rocket);

// Trail particles (points that spawn behind the rocket and fade)
const MAX_TRAIL = 200;
const trailGeo = new THREE.BufferGeometry();
const trailPositions = new Float32Array(MAX_TRAIL * 3);
const trailAlphas = new Float32Array(MAX_TRAIL);
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
const trailMat = new THREE.PointsMaterial({ color: 0x9d8cff, size: 0.22, transparent: true, opacity: 0.7, depthWrite: false });
const trail = new THREE.Points(trailGeo, trailMat);
scene.add(trail);
let trailData = [];

function spawnTrailPoint(pos){
  trailData.push({ x: pos.x + (Math.random()-0.5)*0.1, y: pos.y - 1.3, z: pos.z, life: 1 });
  if (trailData.length > MAX_TRAIL) trailData.shift();
}

function updateTrail(){
  trailData.forEach(p => p.life -= 0.02);
  trailData = trailData.filter(p => p.life > 0);
  for (let i = 0; i < MAX_TRAIL; i++) {
    const p = trailData[i];
    if (p) {
      trailPositions[i*3] = p.x; trailPositions[i*3+1] = p.y; trailPositions[i*3+2] = p.z;
    } else {
      trailPositions[i*3+1] = -999;
    }
  }
  trailGeo.attributes.position.needsUpdate = true;
}

// Explosion burst (on bust) / confetti-ish burst (on cashout)
let burstParticles = [];
function spawnBurst(color, count=60){
  for (let i=0;i<count;i++){
    burstParticles.push({
      pos: rocket.position.clone(),
      vel: new THREE.Vector3((Math.random()-0.5)*0.3,(Math.random())*0.25,(Math.random()-0.5)*0.3),
      life: 1, color
    });
  }
}
const burstGeo = new THREE.BufferGeometry();
const burstPos = new Float32Array(300*3);
burstGeo.setAttribute('position', new THREE.BufferAttribute(burstPos, 3));
const burstMat = new THREE.PointsMaterial({ size: 0.3, vertexColors:false, transparent:true, opacity:1, color: 0xff5c5c });
const burstPoints = new THREE.Points(burstGeo, burstMat);
scene.add(burstPoints);

function updateBurst(){
  burstParticles.forEach(p=>{
    p.pos.add(p.vel);
    p.vel.y -= 0.01;
    p.life -= 0.02;
  });
  burstParticles = burstParticles.filter(p=>p.life>0);
  for(let i=0;i<300;i++){
    const p = burstParticles[i];
    if(p){ burstPos[i*3]=p.pos.x; burstPos[i*3+1]=p.pos.y; burstPos[i*3+2]=p.pos.z; }
    else { burstPos[i*3+1] = -999; }
  }
  burstGeo.attributes.position.needsUpdate = true;
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);

let displayMultiplier = 1.0;
let sceneState = 'idle'; // idle | flying | busted | cashed

function pathForMultiplier(mult){
  const t = Math.min((mult-1)/8, 1);
  const x = -3 + t*3.2;
  const y = 0.5 + t*6.5;
  const z = -t*4;
  return new THREE.Vector3(x, y, z);
}

function animate(){
  requestAnimationFrame(animate);

  if (sceneState === 'flying'){
    const target = pathForMultiplier(displayMultiplier);
    rocket.position.lerp(target, 0.25);
    rocket.rotation.z = -0.15 - Math.min((displayMultiplier-1)/10, 0.35);
    flame.scale.set(1, 0.8 + Math.random()*0.4, 1);
    spawnTrailPoint(rocket.position);
    purpleLight.position.copy(rocket.position);
    camera.position.lerp(new THREE.Vector3(rocket.position.x*0.3, rocket.position.y*0.4+1.5, 9-rocket.position.y*0.15), 0.08);
    camera.lookAt(rocket.position.x*0.5, rocket.position.y*0.5+1, 0);
  }

  updateTrail();
  updateBurst();
  stars.rotation.y += 0.0002;
  renderer.render(scene, camera);
}
animate();

function resetSceneVisual(){
  rocket.position.set(-3, 0.5, 0);
  rocket.rotation.z = -0.15;
  trailData = [];
  sceneState = 'idle';
}
resetSceneVisual();

// ---------------------------------------------------------------- GAME STATE
// Server-authoritative: the multiplier/crash-point come from webapp_api.py on
// every poll tick. `initData` is Telegram's signed proof of identity; the
// backend verifies it against the bot token before trusting the user id.

let currentRoundId = null;
let pollHandle = null;

function authHeaders(){
  return { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg?.initData || '' };
}

async function refreshBalance(){
  try{
    const res = await fetch('/api/balance', { headers: authHeaders() });
    if(!res.ok) return;
    const data = await res.json();
    document.getElementById('balance').textContent = `رصيد: ${data.balance.toFixed(2)} ${data.currency}`;
  }catch(e){ console.error(e); }
}
refreshBalance();

function stopRound(){
  clearInterval(pollHandle);
  pollHandle = null;
  currentRoundId = null;
  document.getElementById('cashBtn').style.display = 'none';
  document.getElementById('betBtn').style.display = 'block';
}

async function pollRound(){
  if(!currentRoundId) return;
  try{
    const res = await fetch(`/api/round/${currentRoundId}`, { headers: authHeaders() });
    const data = await res.json();
    const multEl = document.getElementById('multiplier');

    if(data.status === 'busted'){
      sceneState = 'busted';
      multEl.textContent = data.crash_point.toFixed(2)+'x';
      multEl.className = 'busted';
      document.getElementById('status').textContent = `💥 انفجر عند ${data.crash_point.toFixed(2)}x - خسرت الرهان`;
      spawnBurst(0xff5c5c);
      stopRound();
      setTimeout(resetSceneVisual, 1500);
      return;
    }
    if(data.status === 'cashed'){
      stopRound();
      return;
    }
    displayMultiplier = data.multiplier;
    multEl.textContent = displayMultiplier.toFixed(2)+'x';
    multEl.className = '';
  }catch(e){
    console.error(e);
  }
}

document.getElementById('betBtn').addEventListener('click', async () => {
  const amount = parseFloat(document.getElementById('betInput').value || '0');
  if(!amount || amount <= 0) return;

  document.getElementById('status').textContent = 'جاري إرسال الرهان...';
  try{
    const res = await fetch('/api/bet', {
      method: 'POST', headers: authHeaders(), body: JSON.stringify({ amount })
    });
    const data = await res.json();
    if(!res.ok){
      document.getElementById('status').textContent = 'خطأ: ' + (data.error || 'غير معروف');
      return;
    }
    currentRoundId = data.round_id;
    resetSceneVisual();
    sceneState = 'flying';
    document.getElementById('balance').textContent = `رصيد: ${data.balance.toFixed(2)} Coin`;
    document.getElementById('betBtn').style.display = 'none';
    document.getElementById('cashBtn').style.display = 'block';
    document.getElementById('status').textContent = 'الجولة شغالة...';
    pollHandle = setInterval(pollRound, 300);
  }catch(e){
    document.getElementById('status').textContent = 'تعذر الاتصال بالسيرفر.';
  }
});

document.getElementById('cashBtn').addEventListener('click', async () => {
  if(!currentRoundId) return;
  const roundId = currentRoundId;
  stopRound();
  try{
    const res = await fetch(`/api/round/${roundId}/cashout`, { method: 'POST', headers: authHeaders() });
    const data = await res.json();
    const multEl = document.getElementById('multiplier');
    if(data.status === 'busted'){
      sceneState = 'busted';
      multEl.className = 'busted';
      spawnBurst(0xff5c5c);
      document.getElementById('status').textContent = `💥 انفجر عند ${data.crash_point.toFixed(2)}x قبل ما توصل`;
    }else{
      sceneState = 'cashed';
      multEl.className = 'cashed';
      spawnBurst(0x2fbf71);
      document.getElementById('status').textContent = `✅ سحبت عند ${data.multiplier.toFixed(2)}x - ربحت ${data.payout.toFixed(2)}`;
      refreshBalance();
    }
    setTimeout(resetSceneVisual, 1500);
  }catch(e){
    document.getElementById('status').textContent = 'تعذر تنفيذ السحب.';
  }
});
</script>
</body>
</html>
